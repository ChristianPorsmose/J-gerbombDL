# Custom model
  
# Number of classes
nc: 2  # We only need one class

# [layer, repeats, module, args]
backbone:
  # Initial Downsampling
  - [-1, 1, Conv, [16, 3, 2]]  # 0-P1/2 (C1=16)
  - [-1, 1, Conv, [24, 3, 2]]  # 1-P2/4 (C2=32)
  - [-1, 1, C3k2, [24, True]]   # C3k2 block with 1 repeat

  # Main Feature Extraction (P3)
  - [-1, 1, Conv, [48, 3, 2]]  # 3-P3/8 (C3=64). This is the highest resolution feature used.
  - [-1, 1, C3k2, [48, True]]   # C3k2 block with 1 repeat. (The network depth ends here)

  - [-1, 1, SPPF, [24, 5]]     # 5



# Head (Detection and Segmentation)
head:
  # Using detection head 
  - [[5], 1, Detect, [nc]] # Detect: [nc]