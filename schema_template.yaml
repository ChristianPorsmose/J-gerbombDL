{
    'experiment_name': 'phase1a_adamw_standard',

    'model': {
        type : 'models/adrian.yaml',
        pretrained: False
    },

    'paths': {
        'train': 'dataset_final_boxes_yolo/train.txt',
        'val': 'dataset_final_boxes_yolo/val.txt',
        'test': 'dataset_final_boxes_yolo/test.txt',
    },

    'training': {
        'batch_size': 2,
        'epochs': 2,
        'log_interval': 2,
        'save_interval': 2,
        'save_path': 'weights',
    },

    'optimizer': {
        'type': 'AdamW',
        'lr': 0.001,
        'lr_scheduler': 'fixed',
        'weight_decay': 0.0005,
        'momentum': 0.9
    },

    'freeze': {
        'backbone_layers': 0,
        'dfl': False
    },

    'augmentation': 'none',
    'dataset_size': 0.5,

    'loss': {
        type: 'none',
        lamda_rate: 120,
        proportion: 0.5
    }
}
